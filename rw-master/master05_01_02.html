<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>リタワーク｜コントロールパネル(管理者)</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/images/favicon/apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/master05.css" />
  </head>

  <body>
    <!--#include virtual="./inc_header.html"-->
    <main class="inner-05-01-02">
      <section class="page-nav">
        <h2>運営管理</h2>
        <nav>
          <a href="#" class="is-active">求職者一覧</a>
          <a href="#">&emsp;ー&emsp;TOP表示設定</a>
          <a href="#">事業所へのお知らせ</a>
        </nav>
      </section>
      <section class="container-register">
        <a href="#" class="link-page-back">戻る</a>
        <h2>転職のヒント<span>転職でよくありがちな落とし穴</span></h2>
        <form class="block-form">
          <dl>
            <dt class="is-required">タイトル</dt>
            <dd class="dd-top">
              <input type="text" />
              <div class="item-switch">
                <span>TOPページに表示</span>
                <div class="wrap-toggle-button">
                  <label class="toggle-button">
                    <input type="checkbox" />
                  </label>
                </div>
              </div>
            </dd>
          </dl>
          <dl>
            <dt class="is-required position-top">本文</dt>
            <dd class="dd-editor"></dd>
          </dl>
          <dl>
            <dt class="is-required position-top">サムネイル<br />画像</dt>
            <dd class="edit-image">
              <!-- NOTE 画像登録時は [is-active]付与 -->
              <div class="select-image">
                <h4>ここにファイルをドロップ</h4>
                <span>または</span>
                <button>ファイルを選択</button>
                <span>※縦横サイズがオーバーしている場合は自動でリサイズされます</span>
                <!-- NOTE 警告用表示 -->
                <!-- <div class="wrap-caution">
                    <h5>ファイルサイズが大きすぎます</h5>
                    <p>画像の容量を圧縮してしてから再度アップロードしてください。</p>
                  </div> -->
              </div>
              <ul class="selected-image-list">
                <li>
                  <div class="warp-btn">
                    <button type="button" class="btn-change"></button>
                    <button type="button" class="btn-delate"></button>
                  </div>
                  <picture>
                    <source src="../assets/images/_dummy/hint01.jpg" />
                    <img src="../assets/images/_dummy/hint01.jpg" alt="" />
                  </picture>
                </li>
              </ul>
              <div class="wrap-notice">
                <p>※画像は1枚登録してください</p>
                <p>※JPG、PNG、GIF形式の画像ファイルが登録できます</p>
                <p>※1ファイルあたり最大10MBのファイルが登録できます</p>
                <p>※横1200px、縦675px以上の画像の登録を推奨しています</p>
              </div>
            </dd>
          </dl>
        </form>
        <div class="bottom-box-btn">
          <button type="button" class="item-back">戻る</button>
          <button type="button" class="item-check">入力を確認する</button>
        </div>
        <!--NOTE 修正画面のみ表示 -->
        <button type="button" class="btn-delate-item">削除する</button>
      </section>
      <!--#include virtual="./inc_page-top.html"-->
    </main>
    <!-- NOTE 修正画面用 is-active付与(bg-orange or bg-black)でモーダル表示 -->
    <article class="modal-alert" id="modalBlock">
      <div class="inner-modal">
        <div class="box-title">
          <p>新規事業所削除</p>
          <button type="button" onclick="closeModal()" class="btn-top-close"></button>
        </div>
        <div class="box-details">
          <p>新規法人情報を削除します。よろしいですか？</p>
          <div class="box-btn">
            <button type="button" class="btn-cancel">キャンセル</button>
            <button type="button" class="btn-confirm">はい</button>
          </div>
        </div>
      </div>
    </article>
    <script src="../assets/js/common.js" defer></script>
  </body>
</html>
