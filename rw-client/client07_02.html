<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>リタワーク｜コントロールパネル(管理者)</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/images/favicon/apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/client07.css" />
  </head>

  <body>
    <!--#include virtual="./inc_header.html"-->
    <main class="inner-07-02">
      <section class="page-nav">
        <h2>メッセージ管理</h2>
        <nav>
          <a href="#">メッセージ作成</a>
          <a href="#" class="is-active">送信履歴</a>
        </nav>
      </section>
      <section class="container-detail-list">
        <h2>送信履歴</h2>
        <form class="block-search">
          <button
            type="button"
            id="btnSwitchSearch"
            class="btn-switch"
            aria-controls="innerSearch"
            aria-expanded="false"
          ></button>
          <h3>条件で検索</h3>
          <article id="innerSearch">
            <div class="blockGrid">
              <ul class="box-search-items">
                <li class="item-application-date">
                  <h4>送信日</h4>
                  <div class="wrap-period">
                    <input type="date" name="searchStartDay" />
                    <span>〜</span>
                    <input type="date" name="searchEndDay" />
                  </div>
                </li>
                <li class="item-subject">
                  <h4>件名</h4>
                  <div class="select-subject" data-selectbox>
                    <button type="button" class="selectbox__head" aria-expanded="false">
                      <input type="hidden" name="selectSubject" value="" data-selectbox-hidden />
                      <span class="selectbox__value" data-selectbox-value>選択してください</span>
                    </button>
                    <div class="list-wrapper">
                      <ul class="selectbox__panel">
                        <li>
                          <input type="radio" name="selectSubject" value="1" id="subject01" />
                          <label for="subject01">プランについて</label>
                        </li>
                        <li>
                          <input type="radio" name="selectSubject" value="2" id="subject02" />
                          <label for="subject02">パスワードについて</label>
                        </li>
                        <li>
                          <input type="radio" name="selectSubject" value="3" id="subject03" />
                          <label for="subject03">その他</label>
                        </li>
                      </ul>
                    </div>
                  </div>
                </li>
              </ul>
              <div class="box-btn">
                <button type="button" class="item-clear">条件をクリア</button>
                <button type="button" class="item-search">条件で検索</button>
              </div>
            </div>
          </article>
        </form>
        <article class="block-history-list">
          <div class="box-head">
            <p class="announce-results">条件に<span>23件</span>が該当</p>
            <div class="list-display" data-selectbox>
              <button type="button" class="selectbox__head" aria-expanded="false">
                <input type="hidden" name="display" value="10" data-selectbox-hidden />
                <span class="selectbox__value" data-selectbox-value>10</span>
              </button>
              <div class="list-wrapper">
                <ul class="selectbox__panel">
                  <li>
                    <input type="radio" name="display" id="display01" value="10" checked />
                    <label for="display01">10</label>
                  </li>
                  <li>
                    <input type="radio" name="display" id="display02" value="20" />
                    <label for="display02">20</label>
                  </li>
                  <li>
                    <input type="radio" name="display" id="display03" value="30" />
                    <label for="display03">30</label>
                  </li>
                  <li>
                    <input type="radio" name="display" id="display04" value="50" />
                    <label for="display04">50</label>
                  </li>
                  <li>
                    <input type="radio" name="display" id="display05" value="100" />
                    <label for="display05">100</label>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <ul class="list-search-results">
            <li>
              <div>
                送信日<span class="wrap-sort-btn"
                  ><button type="button" class="arrow-top"></button
                  ><button type="button" class="arrow-bottom is-active"></button
                ></span>
              </div>
              <div>件名</div>
              <div>返信希望</div>
            </li>
            <li>
              <div class="item-date">2025/10/24 <span>16:11</span></div>
              <div class="item-name">プランについて</div>
              <div class="item-return">メール</div>
            </li>
            <li>
              <div class="item-date">2025/10/24 <span>16:11</span></div>
              <div class="item-name">パスワードについて</div>
              <div class="item-return">電話</div>
            </li>
            <li>
              <div class="item-date">2025/10/24 <span>16:11</span></div>
              <div class="item-name">プランについて</div>
              <div class="item-return">メール</div>
            </li>
          </ul>
          <div class="box-pager">
            <div class="box_number">
              <nav>
                <a href="#" class="is-active"></a>
                <a href="#"></a>
                <a href="#"></a>
                <a href="#"></a>
                <a href="#"></a>
                <a href="#"></a>
                <a href="#"></a>
                <a href="#"></a>
              </nav>
              <button type="button" class="btn_next"></button>
            </div>
            <div class="box_input">
              <input type="text" placeholder="1/16513" />
            </div>
          </div>
        </article>
        <div class="bottom-box-btn">
          <button type="button" class="item-back">戻る</button>
        </div>
      </section>
      <!--#include virtual="./inc_page-top.html"-->
    </main>
    <script src="../assets/js/common.js" defer></script>
    <script>
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-arrow');
        if (!btn) return;

        const itemPlan = btn.closest('.item-plan');
        if (!itemPlan) return;

        const innerPlan = itemPlan.querySelector('.inner-plan');
        if (!innerPlan) return;

        innerPlan.classList.toggle('is-active');
      });
    </script>
  </body>
</html>
